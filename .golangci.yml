version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - cyclop
    - decorder
    - dogsled
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - maintidx
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - predeclared
    - staticcheck
    - tagliatelle
    - testpackage
    - thelper
    - unconvert
    - unused
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    decorder:
      dec-order:
        - type
        - var
        - const
        - func
      disable-dec-order-check: false
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - encoding/json.Marshal
        - encoding/json.MarshalIndent
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*encoding/csv.Writer).Write
    errchkjson:
      check-error-free-encoding: true
      report-no-exported: true
    exhaustive:
      default-signifies-exhaustive: true
    godot:
      scope: all
    govet:
      disable:
        - fieldalignment
      enable-all: true
    importas:
      no-extra-aliases: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - ^([A-Z])$
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: UK
      ignore-rules:
        - davisd
        - color
    mnd:
      ignored-functions:
        - strconv.Parse*
        - strconv.Format*
        - big.Parse*
    nakedret:
      max-func-lines: 0
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
    wsl_v5:
      disable:
        - err
        - decl
  exclusions:
    generated: lax
    rules:
      - linters:
          - decorder
          - dupl
          - err113
          - errcheck
          - errchkjson
          - forcetypeassert
          - funlen
          - gocognit
          - goconst
          - godot
          - gosec
          - lll
          - maintidx
          - nilnil
          - wsl_v5
        path: _test\.go
      - linters:
          - gochecknoglobals
          - mnd
          - tagliatelle
        path: config/
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
